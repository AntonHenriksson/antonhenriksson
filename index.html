<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anton Henriksson</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            max-width: 600px;
            width: 100%;
            border: 2px dashed #00ff41;
            padding: 30px;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.15);
            border-radius: 4px;
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(0, 255, 65, 0.6);
        }

        .tech-stack {
            font-size: 0.9rem;
            opacity: 0.85;
            margin-bottom: 25px;
            word-spacing: 2px;
        }

        .description {
            line-height: 1.6;
            margin-bottom: 20px;
        }

        a {
            color: #00ff41;
            text-decoration: none;
            font-weight: bold;
            border-bottom: 1px dashed #00ff41;
            transition: all 0.2s ease-in-out;
        }

        a:hover {
            text-shadow: 0 0 8px #00ff41;
            border-bottom-style: solid;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Anton Henriksson</h1>
        <div class="tech-stack">[Tech Stack: Java | Spring | Quarkus | Docker | React | JS]</div>
        <p class="description">
            ventilationisyd.se is a custom solution for a small business looking to integrate their Outlook workflow
            into a simple, accessible booking website for clients.
        </p>
        <p>
            <a href="http://www.ventilationisyd.se" target="_blank" rel="noopener noreferrer">>
                www.ventilationisyd.se</a>
        </p>
    </div>
</body>

</html>
